server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: doctor-wang-mock-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doctor_wang}
    username: ${SPRING_DATASOURCE_USERNAME:doctor_wang}
    password: ${SPRING_DATASOURCE_PASSWORD:doctor_wang}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    token-prefix: ${APP_AUTH_TOKEN_PREFIX:dw-token}
  file-storage:
    root: ${REPORT_FILE_STORAGE_ROOT:./data/report-files}
    signing-secret: ${REPORT_FILE_STORAGE_SIGNING_SECRET:dev-only-change-me}
  report-processing:
    worker-enabled: ${REPORT_PROCESSING_WORKER_ENABLED:false}
    poll-interval-ms: ${REPORT_PROCESSING_POLL_INTERVAL_MS:5000}
    max-attempts: ${REPORT_PROCESSING_MAX_ATTEMPTS:3}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:false}
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_SERVICE_INTERNAL_TOKEN:}
    source-version: ${AI_SERVICE_SOURCE_VERSION:upload-v1}
