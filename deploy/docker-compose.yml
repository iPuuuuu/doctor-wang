services:
  postgres:
    image: postgres:16
    container_name: doctor-wang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctor_wang}
      POSTGRES_USER: ${POSTGRES_USER:-doctor_wang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctor_wang} -d ${POSTGRES_DB:-doctor_wang}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../doctor-wang-mock-server
    container_name: doctor-wang-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-doctor_wang}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-doctor_wang}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:?APP_AUTH_JWT_SECRET must be set}
      APP_AUTH_JWT_ISSUER: ${APP_AUTH_JWT_ISSUER:-doctor-wang-backend}
      APP_AUTH_JWT_AUDIENCE: ${APP_AUTH_JWT_AUDIENCE:-doctor-wang-android}
      APP_AUTH_JWT_TTL_SECONDS: ${APP_AUTH_JWT_TTL_SECONDS:-3600}
      # 1.6GB 内存 VPS：限制 JVM 堆
      JAVA_TOOL_OPTIONS: -Xmx384m
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      APP_AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-false}
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:?AI_SERVICE_INTERNAL_TOKEN must be set}
      REPORT_FILE_STORAGE_ROOT: /shared-report-files
      REPORT_PROCESSING_WORKER_ENABLED: ${REPORT_PROCESSING_WORKER_ENABLED:-false}
      VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-false}
      VIRUS_SCAN_HOST: ${VIRUS_SCAN_HOST:-clamav}
      VIRUS_SCAN_PORT: ${VIRUS_SCAN_PORT:-3310}
    volumes:
      - report_files:/shared-report-files
    expose:
      - "8080"
    healthcheck:
      # DEPLOY-001a：基于 actuator health 端点探活（镜像已内置 curl）
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-service:
    build:
      context: ../ai-service
    container_name: doctor-wang-ai-service
    restart: unless-stopped
    environment:
      DW_AI_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:?AI_SERVICE_INTERNAL_TOKEN must be set}
      DW_AI_OBJECT_STORE_ROOT: /shared-report-files
      DW_AI_JOB_STATE_PATH: /data/ai-jobs.sqlite3
    volumes:
      - report_files:/shared-report-files:ro
      - ai_job_state:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: doctor-wang-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_DIR:?TLS_CERTS_DIR must be set}:/etc/nginx/certs:ro

  # SEC-001 / ADR-0008：ClamAV 病毒扫描（可选 profile）。
  # 启用：docker compose --profile scan --env-file .env up -d --build，并设 VIRUS_SCAN_ENABLED=true。
  clamav:
    image: clamav/clamav:stable
    container_name: doctor-wang-clamav
    restart: unless-stopped
    profiles: ["scan"]
    volumes:
      - clamav_db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/clamav/clamd.sock || ss -ltn | grep -q 3310"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  report_files:
  ai_job_state:
  clamav_db:
