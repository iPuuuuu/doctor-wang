[project]
name = "doctor-wang-ai-service"
version = "0.1.0"
description = "Controlled PDF ingestion, embeddings, vector search and RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1",
  "langgraph>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "reportlab>=4,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
